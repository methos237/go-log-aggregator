# Observability overlay: Prometheus, Grafana and Jaeger, with the collector and
# agent exporting traces. Applied by every `make dev*` target, so `make dev`
# comes up with populated dashboards and no manual configuration. Kept as a
# separate file so the core stack stays readable and can run without it:
#   docker compose -f deploy/docker-compose.yml up
#
# Everything binds loopback, like the base stack. Grafana runs with anonymous
# admin access, which is the "zero clicks" part and is only acceptable because
# nothing off-box can reach it.
services:
  collector:
    environment:
      LOGAGG_TRACING_ENABLED: "true"
      LOGAGG_TRACING_ENDPOINT: jaeger:4317
    depends_on:
      jaeger:
        condition: service_started

  agent:
    environment:
      LOGAGG_TRACING_ENABLED: "true"
      LOGAGG_TRACING_ENDPOINT: jaeger:4317
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    # prom/prometheus:v3.14.0
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # 9090 on the host is the collector's admin port, so Prometheus takes 9091.
      - "127.0.0.1:9091:9090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    # grafana/grafana:12.4.10
    image: grafana/grafana@sha256:c132a683b2430fff9115a29b2a79c8ab97540cdcc90846e3c81878c778ca3596
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Datasources and the dashboard provider are provisioned from git; the
      # dashboards directory is what the provider loads.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped

  jaeger:
    # jaegertracing/jaeger:2.20.0 -- the v2 all-in-one, which speaks OTLP on
    # 4317/4318 natively. Traces are held in memory; this is a dev stack.
    image: jaegertracing/jaeger@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    ports:
      - "127.0.0.1:16686:16686"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
