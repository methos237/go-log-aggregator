# Reverse proxy for the scaled dev stack (docker-compose.scale.yml).
#
# Compose cannot publish one host port for several replicas, so with more than
# one collector the host talks to this proxy and the proxy spreads connections
# over whatever `collector` resolves to. Resolution goes through Compose's
# embedded DNS on every new connection (resolver ... valid=5s, and a variable in
# proxy_pass, which is what makes nginx re-resolve instead of pinning the first
# address it saw at startup), so replicas that come and go are picked up within
# seconds and a killed one stops receiving traffic as soon as its name is gone.
#
# Both listeners are plain TCP/HTTP: the dev stack runs ingest and the API in
# plaintext on a loopback-published port. Anything beyond a laptop terminates
# TLS at the collectors themselves and does not use this file.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

# gRPC ingest is proxied at layer 4. A stream proxy carries HTTP/2 frames
# untouched, so agents, loadgen and logctl send speak to a collector exactly as
# they would directly; per-connection balancing is enough because every client
# holds one long-lived stream.
stream {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 9095;
        set $ingest collector:9095;
        proxy_pass $ingest;
        proxy_connect_timeout 5s;
    }
}

# The query API is proxied at layer 7 so each request, not each connection, can
# land on a different collector: a query is coordinated by whichever node takes
# it, and spreading requests spreads the coordination.
http {
    resolver 127.0.0.11 valid=5s;
    access_log off;
    # A request carrying Upgrade gets "Connection: upgrade" forwarded; anything
    # else gets the header cleared so keepalive to the upstream works. This is
    # what lets the phase 6 WebSocket tail handshake pass through.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;

        location / {
            set $api collector:8080;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
