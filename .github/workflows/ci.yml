name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: a force-push should not leave stale jobs
# burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [[ -n "$out" ]]; then
            echo "::error::not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: go mod tidy is current
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # The integration suite is behind a build tag, so the linters above skip it
      # entirely unless it is asked for explicitly.
      - name: golangci-lint (integration-tagged code)
        run: golangci-lint run --build-tags=integration ./test/...

      # Architectural invariants that golangci-lint cannot express — currently the
      # no-unbounded-channels rule, which is a property of this design rather than
      # of Go. Pinned to the version the Makefile names.
      # Checksum-pinned, not just version-pinned: GitHub release assets are mutable
      # by the upstream owner, and this step sudo-installs a binary that then runs
      # over the checked-out source. The rest of the project pins by digest for the
      # same reason (see the image pins in deploy/docker-compose.yml).
      - name: Install ast-grep
        env:
          AST_GREP_VERSION: "0.45.1"
          AST_GREP_SHA256: "76fb6555be6734fb5057dba8d2fb756430f374bb9e1af694cf1ce00e13238d63"
        run: |
          curl -fsSL "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/ast-grep.zip
          echo "${AST_GREP_SHA256}  /tmp/ast-grep.zip" | sha256sum -c -
          unzip -o -q /tmp/ast-grep.zip -d /tmp/ast-grep
          sudo install -m 0755 /tmp/ast-grep/ast-grep /usr/local/bin/ast-grep
          ast-grep --version

      - name: Lint architectural invariants
        run: make lint-arch

      - name: Lint protobuf definitions
        run: make proto-lint

      # Generated code is committed, so a .proto edit without a regenerate would
      # otherwise ship a stale wire format.
      - name: Generated protobuf code is current
        run: make proto-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -race is not optional for this project: the whole thing is concurrent, and
      # a data race that only shows under load is the hardest class of bug here.
      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # testcontainers-go starts TimescaleDB itself, using the same digest-pinned
      # image deploy/docker-compose.yml runs. No compose stack needed here, and no
      # LOGAGG_TEST_DB_DSN: that variable is for the local inner loop against
      # `make dev`.
      #
      # This is the job that enforces the phase 1 exit criterion: a million records
      # through the writer, dedup on replay, and the compression and continuous
      # aggregate policies doing real work.
      - name: Run integration tests
        run: make test-integration

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Scanned separately because the integration suite is behind a build tag and
      # pulls in testcontainers and the Docker client, which the default scan cannot
      # see at all.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags=integration ./...

  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Build only: the images are not pushed anywhere. This job exists to catch
      # a Dockerfile that stopped working, which unit tests cannot see.
      # Ref name and SHA go through env rather than being interpolated directly
      # into the build-args block, so a hostile branch name cannot inject extra
      # build arguments.
      - name: Build collector image
        uses: docker/build-push-action@v6
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        with:
          context: .
          push: false
          build-args: |
            BIN=collector
            VERSION=${{ env.REF_NAME }}
            COMMIT=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: Public health endpoint answers
        run: curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/healthz

      - name: Readiness endpoint answers
        run: curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/readyz

      - name: Metrics endpoint exposes build info
        run: curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:9090/metrics | grep -q logagg_build_info

      # /readyz only returns 200 once the database check passes, so reaching this point
      # already proves the pool is live. This asserts the collector also migrated the
      # schema on the way up, which is what LOGAGG_DB_MIGRATE_ON_START promises.
      - name: Collector migrated the schema at startup
        run: |
          docker compose -f deploy/docker-compose.yml exec -T timescaledb \
            psql -U logagg -d logagg -tAc \
            "SELECT count(*) FROM timescaledb_information.hypertables WHERE hypertable_name = 'logs'" \
            | grep -qx 1

      - name: pprof is not reachable on the public port
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/debug/pprof/)
          if [[ "$code" == "200" ]]; then
            echo "::error::pprof is exposed on the public listener"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
